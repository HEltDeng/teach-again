plugins {
    id 'com.android.application'
}

android {
    namespace 'com.teachagain.app'
    // android-36.1 = API 36, minor API level 1
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.teachagain.app"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.core:core:1.16.0'
    // 中文文字识别，捆绑模型（非 Play 动态下载）
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
}
